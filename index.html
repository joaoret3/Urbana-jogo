<!-- Aviso caso falte o Phaser (o jogo não usa internet) -->
<div id="erro">Não encontrei <b>lib/phaser.min.js</b>. Copie de novo a pasta completa do Urbana (o arquivo vem junto). Veja LEIA-ME.txt.</div>

<!-- O Phaser desenha o mapa aqui -->
<div id="jogo"></div>
<!-- Menus, fichas, quiz e Black Book (HTML por cima do jogo) -->
<div id="ui"></div>

<!-- Celular/tablet em pé: pede para virar o aparelho (aparece só com a tela em pé; veja estilo/urbana.css) -->
<div id="aviso-girar" role="alert" aria-live="assertive">
  <svg class="girar-celular" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <rect x="20" y="6" width="24" height="46" rx="5"/><path d="M29 46h6"/>
    <path class="girar-seta" d="M10 40a24 24 0 0 0 38 14M48 54l-1-9M48 54l-9-1"/>
  </svg>
  <h2>Vire o aparelho</h2>
  <p>O Urbana é jogado com o celular ou tablet <strong>deitado</strong>. Gire a tela para continuar.</p>
  <small>Se a tela não girar, desligue o bloqueio de rotação nas configurações do aparelho.</small>
</div>

<script>if (!window.Phaser) document.getElementById('erro').style.display = 'block';</script>
